name: Docker Publish

# 推送 vX.Y.Z 形式的 git tag 时构建 vLLM 镜像推送到 GHCR，再同步到阿里云。
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/ai-fsxgt/qwen3-asr-service
  ALIYUN_IMAGE: registry.cn-hangzhou.aliyuncs.com/ripper/qwen3-asr-service

jobs:
  vllm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.push.outputs.digest }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push vLLM image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.vllm
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VLLM_TAG=v0.14.0
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.value }}-vllm
            ${{ env.GHCR_IMAGE }}:latest-vllm
          provenance: false

  sync-aliyun:
    runs-on: ubuntu-latest
    needs: vllm
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Sync vLLM image to Aliyun
        env:
          GHCR_IMAGE_REF: ${{ needs.vllm.outputs.image-ref }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create --prefer-index=false \
            --tag "$ALIYUN_IMAGE:${version}-vllm" \
            --tag "$ALIYUN_IMAGE:latest-vllm" \
            "$GHCR_IMAGE_REF"
