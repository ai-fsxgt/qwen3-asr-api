name: Docker Publish

# 推送 vX.Y.Z 形式的 git tag 时构建并发布唯一的 vLLM 镜像。
on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE_NAME: registry.cn-hangzhou.aliyuncs.com/ripper/qwen3-asr-service

jobs:
  vllm:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push vLLM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.vllm
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VLLM_TAG=v0.14.0
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}-vllm
            ${{ env.IMAGE_NAME }}:latest-vllm
          provenance: false
