services:
  asr-vllm:
    image: ${ASR_VLLM_IMAGE:-registry.cn-hangzhou.aliyuncs.com/ripper/qwen3-asr-service:latest-vllm}
    container_name: qwen3-asr-vllm
    ports:
      - "${ASR_PORT:-8765}:8765"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # config.yaml 中显式配置的同名项优先级高于环境变量。
      ASR_API_KEY: ${ASR_API_KEY:-}
      SPEAKER_DATABASE_URL: ${SPEAKER_DATABASE_URL:-}
    mem_limit: 10g
    memswap_limit: 10g
    volumes:
      # config.yaml 须先存在（用根目录 manage.sh 引导，或从 config.example.yaml 拷贝）。
      - type: bind
        source: ../asr-service/config.yaml
        target: /app/config.yaml
        bind:
          create_host_path: false
      - ../asr-service/models:/app/models
      - ../asr-service/logs:/app/logs
      - ../asr-service/data:/app/data
    # 容器内端口固定，ASR_PORT 只控制宿主机映射，避免被 config.yaml 的 port 改写。
    command:
      - --port=8765
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
